<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Luxora | Premium Living</title>
    <link rel="shortcut icon" href="../Images/logo.png" type="image/x-icon">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="user.css">
    <link rel="stylesheet" href="../style.css">
</head>
<body>

<!-- ================= NAVBAR ================= -->
    <nav class="nav">
        <div class="nav-wrap">
            <input type="checkbox" id="menu-toggle" hidden>

            <label for="menu-toggle" class="hamburger">
                <i class="fa-solid fa-bars-staggered"></i>
            </label>

            <div class="brand">Luxora</div>

            <div class="nav-links">
                <label for="menu-toggle" class="close-drawer">
                    <i class="fa-solid fa-xmark"></i>
                </label>

                <div class="drawer-header">
                    <div class="user-avatar"><i class="fa-solid fa-circle-user"></i></div>
                    <div class="user-info">
                        <span>Welcome back,</span>
                    </div>
                </div>

                <ul class="menu-list">
                    <li><a href="home.html"><i class="fa-solid fa-house"></i> Home</a></li>
                    <li><a href="products.html"><i class="fa-solid fa-bag-shopping"></i> Shop All</a></li>
                    <li><a href="newproduct.html"><i class="fa-solid fa-bolt"></i> New Arrivals</a></li>
                    <li><a href="wishlist.html"><i class="fa-solid fa-heart"></i> Wishlist</a></li>
                    <hr class="mobile-only">
                    <li><a href="about.html">About Us</a></li>
                    <li><a href="contact.html">Contact & Support</a></li>
                </ul>

                <div class="drawer-footer mobile-only">
                    <p>Follow Luxora</p>
                    <div class="social-icons">
                        <a href="#"><i class="fa-brands fa-instagram"></i></a>
                        <a href="#"><i class="fa-brands fa-tiktok"></i></a>
                        <a href="#"><i class="fa-brands fa-pinterest-p"></i></a>
                    </div>
                </div>
            </div>

            <div class="user-action">
                <button id="LogoutBtn" title="Logout">
                    <i class="fa-solid fa-right-from-bracket"></i>
                </button>
            </div>
        </div>
    </nav>
<!-- =============== NAVBAR END =============== -->



<main class="products-wrapper">

  <!-- SECOND NAVBAR (SEARCH + SORT) -->
  <div class="sub-navbar">
    <div class="sub-left">
      <h3>Products</h3>
    </div>

    <div class="sub-right">
      <input type="text" placeholder="Search products..." />
      <select>
        <option>Sort by</option>
        <option>Newest</option>
        <option>Price: Low to High</option>
        <option>Price: High to Low</option>
      </select>
    </div>
  </div>

  <!-- MAIN LAYOUT -->
  <div class="products-layout">

    <!-- FILTER SIDEBAR -->
    <aside class="filter-panel">
      <h4>Filter Products</h4>

      <div class="filter-group">
        <p>Category</p>
        <label><input type="checkbox"> Bags</label>
        <label><input type="checkbox"> Shoes</label>
        <label><input type="checkbox"> Accessories</label>
      </div>

      <div class="filter-group">
        <p>Price</p>
        <label><input type="radio" name="price"> Low to High</label>
        <label><input type="radio" name="price"> High to Low</label>
      </div>

      <div class="filter-group">
        <p>Status</p>
        <label><input type="checkbox"> Active</label>
        <label><input type="checkbox"> Inactive</label>
      </div>
    </aside>

    <!-- PRODUCTS -->
    <section class="products-section">

      <div class="products-grid">

                <div class="card-preview-area">
                    <div id="product-card-container">
                      
                    </div>
                </div>

      </div>

    </section>

  </div>
</main>

    <script type="module" src="./user.js"></script>
    <script type="module" src="../JavaScript Files/dashboad.js"></script>
    <script type="module" src="../JavaScript Files/config.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    
</body>
</html>
