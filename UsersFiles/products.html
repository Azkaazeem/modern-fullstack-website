<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Luxora | Premium Living</title>
  <link rel="shortcut icon" href="../Images/logo.png" type="image/x-icon">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap"
    rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="../style.css">
  <link rel="stylesheet" href="user.css">
</head>

<body>

  <!-- ================= NAVBAR ================= -->
  <nav class="nav luxora-nav">
  </nav>
  <!-- =============== NAVBAR END =============== -->



  <main class="products-wrapper">

    <!-- SECOND NAVBAR (SEARCH + SORT) -->
    <div class="sub-navbar">
      <div class="sub-left">
        <h3>Products</h3>
      </div>

      <div class="sub-right">
        <input type="text" placeholder="Search products..." />
        <select>
          <option>Sort by</option>
          <option>Newest</option>
          <option>Price: Low to High</option>
          <option>Price: High to Low</option>
        </select>
      </div>
    </div>

    <!-- MAIN LAYOUT -->
    <div class="products-layout">

      <!-- FILTER SIDEBAR -->
      <aside class="filter-panel">
        <h4>Filter Products</h4>

        <div class="filter-group">
          <p>Category</p>
          <label><input type="checkbox"> Bags</label>
          <label><input type="checkbox"> Shoes</label>
          <label><input type="checkbox"> Accessories</label>
        </div>

        <div class="filter-group">
          <p>Price</p>
          <label><input type="radio" name="price"> Low to High</label>
          <label><input type="radio" name="price"> High to Low</label>
        </div>

        <div class="filter-group">
          <p>Status</p>
          <label><input type="checkbox"> Active</label>
          <label><input type="checkbox"> Inactive</label>
        </div>
      </aside>

      <!-- PRODUCTS -->
      <section class="products-section">

        <div class="products-grid">

          <div class="card-preview-area">
            <div id="product-card-container">

            </div>
          </div>

        </div>

      </section>

    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script type="module" src="./user.js"></script>
  <script type="module" src="../JavaScriptFiles/dashboad.js"></script>
  <script type="module" src="../JavaScriptFiles/config.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

</body>

</html>
